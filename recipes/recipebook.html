<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Your Name">
        <meta name="description" content="RecipeBook of a collection of easy and delicious recipes.">
        <!-- Open Graph (Facebook, LinkedIn, etc.) -->
        <meta property="og:type" content="website">
        <meta property="og:title" content="RecipeBook">
        <meta property="og:description" content="A collection of recipes">
        <meta property="og:url" content="Your URL">
        <meta property="og:image" content="social-preview-image.png">
        <!-- X Card -->
        <meta name="twitter:card" content="Social Preview Image">
        <meta name="twitter:title" content="RecipeBook">
        <meta name="twitter:description" content="A collection of recipes">
        <meta name="twitter:image" content="social-preview-image.png">
        <!-- One favicon (ICO works everywhere) -->
        <link rel="icon" href="favicon.ico">
        <!-- One Apple Touch Icon (iOS home screen) -->
        <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
        <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="recipebook.css"> 
        <script src="recipebook.js" defer></script> 
        <title>RecipeBook</title>
    </head>
    <body>
        <header class="header">
            <div class="logo-title">
                <img src="images/recipe-book.png" alt="RecipeBook logo">
                <h1>RecipeBook</h1>
            </div>
            <nav class="search">
                <input id="searchInput" type="text" placeholder="Search recipes">
                <button id="button">
                    <img src="images/search.svg" alt="search icon">
                </button>
            </nav>
        </header>
        <main>
            <section class="recipe">
                <div id="recipeContainer" class="recipe-content">
                    
                </div>
            </section>
        </main>
        <footer>
            <div class="social">
                <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
                <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
                <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
                <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
            </div>
            <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>    
        </footer>                                
    </body>
</html>
